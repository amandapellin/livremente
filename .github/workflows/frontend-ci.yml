name: Frontend CI

on:
  pull_request:
    branches: [develop, main]

# Cancela runs antigas do mesmo PR quando chega commit novo
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instala pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (type-check + bundle)
        run: pnpm build

      # Quando houver suíte de testes (ex.: Vitest), descomente:
      # - name: Testes
      #   run: pnpm test
